[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai-stage0"
version = "0.1.0"
description = "Stage 0 exercises for Python, C++, OpenCV, NumPy, PyTorch, and CMake."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "opencv-python>=4.10,<5",
  "torch>=2.9,<3",
  "torchvision>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-ra -p no:ament_pep257 -p no:ament_lint -p no:launch_testing -p no:ament_xmllint -p no:ament_flake8 -p no:launch_ros -p no:ament_mypy -p no:ament_copyright"
markers = [
  "gpu: test needs a CUDA-enabled PyTorch install",
  "slow: downloads data or trains a model",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["python"]
